{{define "wizard_clarify_fragment"}}
<p>{{t "webui.wizard.clarify.intro"}}</p>
<ul>
  {{range .Questions}}<li>{{.}}</li>{{end}}
</ul>
<form hx-post="/wizard/clarify" hx-target="#wizard-step" hx-swap="innerHTML">
  <input type="hidden" name="state" value="{{.State}}">
  <label for="answer">{{t "webui.wizard.field.answer"}}</label>
  <textarea id="answer" name="answer" required></textarea>
  <div style="margin-top:0.75rem;"><button type="submit">{{t "webui.wizard.clarify.submit"}}</button></div>
</form>
{{end}}

{{define "confirm_backtest_form"}}
<p class="note">{{t "webui.strategy_detail.confirm_backtest.note"}}</p>
<form class="inline" method="post" action="/strategies/{{.Strategy.ID}}/confirm-backtest">
  <div>
    <label for="cb_actor_id">{{t "webui.strategy_detail.form.actor_id_label"}}</label>
    <input id="cb_actor_id" name="actor_id" required>
  </div>
  <div>
    <label for="cb_reason">{{t "webui.strategy_detail.form.reason_label"}}</label>
    <input id="cb_reason" name="reason" required style="min-width:16rem;">
  </div>
  <button type="submit">{{t "webui.strategy_detail.confirm_backtest.heading"}}</button>
</form>
{{end}}

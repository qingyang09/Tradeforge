{{define "live_unlock_form"}}
<p class="warn">{{t "webui.strategy_detail.live_unlock.warning"}}</p>
<form class="inline" method="post" action="/strategies/{{.Strategy.ID}}/unlock-live">
  <div>
    <label for="actor_id">{{t "webui.strategy_detail.form.actor_id_label"}}</label>
    <input id="actor_id" name="actor_id" required>
  </div>
  <div>
    <label for="reason">{{t "webui.strategy_detail.form.reason_label"}}</label>
    <input id="reason" name="reason" required style="min-width:16rem;">
  </div>
  <button type="submit" class="danger">{{t "webui.strategy_detail.live_unlock.heading"}}</button>
</form>
{{end}}

{{/* symbol_autocomplete_style/_script attach a "search as you type" dropdown
     of suggestions to a symbol input field. The two defines each wrap a
     <style>/<script> separately, so each page can decide where to embed them
     (the list page is a content fragment embedded in the backend layout, the
     chart/builder page is an independent dark-themed document) without
     depending on each other's CSS context -- the dropdown's colors are a
     fixed light-card look, readable regardless of which theme it's embedded
     in. */}}

{{define "symbol_autocomplete_style"}}
<style>
  .symbol-ac { position: relative; }
  .symbol-ac-list {
    display: none;
    position: absolute; z-index: 50; top: 100%; left: 0; right: 0; margin-top: 2px;
    background: #fff; border: 1px solid #d0d5dd; border-radius: 6px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
    max-height: 260px; overflow-y: auto;
  }
  .symbol-ac-list.open { display: block; }
  .symbol-ac-item {
    padding: 0.4rem 0.7rem; font-size: 0.85rem; color: #1a1a1a; cursor: pointer;
  }
  .symbol-ac-item:hover, .symbol-ac-item.active { background: #eef2ff; }
</style>
{{end}}

{{define "symbol_autocomplete_script"}}
<script>
(function () {
  // initSymbolAutocomplete wraps an <input> in a container and attaches a
  // dropdown suggestion list, sourced from GET /api/symbols (real OKX spot
  // symbols, not a local guess). Whether the endpoint is temporarily
  // unreachable or the user just types and submits without picking a
  // suggestion, the input's original submit path is unaffected either way --
  // this is a pure enhancement, not a replacement.
  window.initSymbolAutocomplete = function (input) {
    if (!input || input.dataset.acBound) return;
    input.dataset.acBound = "1";

    var wrap = document.createElement("div");
    wrap.className = "symbol-ac";
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);

    var list = document.createElement("div");
    list.className = "symbol-ac-list";
    wrap.appendChild(list);

    var items = [];
    var activeIndex = -1;
    var debounceTimer = null;
    var requestSeq = 0;

    function close() {
      list.classList.remove("open");
      list.innerHTML = "";
      items = [];
      activeIndex = -1;
    }

    function selectItem(symbol) {
      input.value = symbol;
      close();
      var form = input.closest("form");
      if (form) { if (form.requestSubmit) form.requestSubmit(); else form.submit(); }
    }

    function highlight() {
      var children = list.children;
      for (var i = 0; i < children.length; i++) {
        children[i].classList.toggle("active", i === activeIndex);
      }
    }

    function render(matches) {
      items = matches || [];
      activeIndex = -1;
      list.innerHTML = "";
      if (!items.length) { close(); return; }
      items.forEach(function (sym) {
        var el = document.createElement("div");
        el.className = "symbol-ac-item";
        el.textContent = sym;
        // mousedown (not click) is deliberate: the input's blur handler also
        // closes the dropdown, and click fires after blur, by which point
        // the dropdown has already been cleared -- clicking the option would
        // be a no-op.
        el.addEventListener("mousedown", function (e) {
          e.preventDefault();
          selectItem(sym);
        });
        list.appendChild(el);
      });
      list.classList.add("open");
    }

    function search(q) {
      var seq = ++requestSeq;
      fetch("/api/symbols?q=" + encodeURIComponent(q))
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (data) {
          if (seq !== requestSeq) return; // stale response: the user has already typed something new
          render(data);
        })
        .catch(function () { /* a failed suggestion fetch doesn't affect normal manual submission */ });
    }

    input.addEventListener("input", function () {
      var q = input.value.trim();
      clearTimeout(debounceTimer);
      if (!q) { close(); return; }
      debounceTimer = setTimeout(function () { search(q); }, 180);
    });

    input.addEventListener("keydown", function (e) {
      if (!list.classList.contains("open")) return;
      if (e.key === "ArrowDown") {
        e.preventDefault();
        activeIndex = Math.min(activeIndex + 1, items.length - 1);
        highlight();
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        activeIndex = Math.max(activeIndex - 1, 0);
        highlight();
      } else if (e.key === "Enter") {
        if (activeIndex >= 0 && items[activeIndex]) {
          e.preventDefault();
          selectItem(items[activeIndex]);
        }
      } else if (e.key === "Escape") {
        close();
      }
    });

    input.addEventListener("blur", function () {
      setTimeout(close, 120);
    });
  };
})();
</script>
{{end}}

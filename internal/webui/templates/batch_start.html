{{define "batch_start_content"}}
<h1>{{t "webui.batch.start.title"}}</h1>
<p class="note">
  {{t "webui.batch.start.intro1"}}
</p>
<p class="note">
  {{t "webui.batch.start.intro2"}}
</p>

<div id="batch-step" class="card">
  {{if not .AgentReady}}
    <p class="warn">{{t "webui.batch.start.agent_not_ready"}}</p>
  {{else}}
    <form hx-post="/wizard/batch/scan" hx-target="#batch-step" hx-swap="innerHTML">
      <label for="count">{{t "webui.batch.start.count_label" "max" .MaxN}}</label>
      <input type="number" id="count" name="count" min="1" max="{{.MaxN}}" value="{{.DefaultN}}">
      <label for="utterance">{{t "webui.wizard.field.utterance"}}</label>
      <textarea id="utterance" name="utterance" placeholder="{{t "webui.batch.start.utterance_placeholder"}}" required></textarea>
      <div style="margin-top:0.75rem;"><button type="submit">{{t "webui.batch.start.submit"}}</button></div>
    </form>
  {{end}}
</div>
{{end}}

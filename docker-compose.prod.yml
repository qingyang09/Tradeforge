# This is an independent file from the root docker-compose.yml, not an override of it --
# that file's host-port offsets (55432/56379/59200) exist to avoid "this dev machine
# already has other stuff installed," a reason that doesn't apply on a fresh server, and
# copying it verbatim here would just leave people wondering whether those odd port
# numbers mean something special. This file additionally adds three application services
# that run in containers (webui/executor/signal-engine), talking to each other over
# compose's internal network by service name (postgres:5432, redis:6379, kafka:9092)
# rather than through host port forwarding.
#
# Read before deploying:
#   1. Verify directly on this server that its IP genuinely isn't blocked by the exchange:
#        curl -sS -o /dev/null -w '%{http_code}\n' https://testnet.binance.vision/api/v3/ping
#      Beyond regional blocks, Binance/Bybit also broadly block well-known cloud
#      providers' IP ranges regardless of which country the datacenter is in -- provider
#      geography alone isn't enough, you have to actually test it.
#   2. Copy .env.prod.example to .env and replace TF_MASTER_KEY / TF_PG_PASSWORD with real
#      strong passwords -- don't use the local-dev defaults. Losing TF_MASTER_KEY
#      permanently locks every user out of their stored exchange/LLM credentials, so back
#      it up separately -- don't let it live only in this .env file.
#   3. webui's port 8080 is only flagged here at the documentation level: production
#      should sit behind a reverse proxy (nginx/caddy) + HTTPS, not expose this port
#      directly to the public internet -- this compose file itself doesn't include a
#      reverse-proxy configuration.
#   4. Don't pass exchange credentials via environment variables: after starting up, open
#      /signup to register an account, log in, and configure them in the "exchange
#      order-placement channel" section of the /settings page -- they're encrypted at rest
#      in Postgres, so redeploying doesn't require passing the key again.
#   5. After the multi-tenant SaaS rework, the executor/signal-engine services still each
#      serve exactly one user per process (see the doc comment in cmd/executor/main.go) --
#      TF_OWNER_EMAIL must be the email of a real account already registered via /signup,
#      or these two containers won't be able to connect to the database and find that
#      user's strategies and credentials. Getting multiple users' strategies to run
#      automatically at the same time currently requires starting a separate
#      executor/signal-engine container pair per user (duplicate these two service
#      definitions with a different TF_OWNER_EMAIL each) -- this is a known limitation of
#      the current stage, not something missing from this file.
#
# Usage:
#   docker build -f Dockerfile.webui -t tradeforge-webui .
#   docker build -f go.Dockerfile --build-arg CMD=executor -t tradeforge-executor .
#   docker build -f go.Dockerfile --build-arg CMD=signal-engine -t tradeforge-signal-engine .
#   docker compose -f docker-compose.prod.yml --env-file .env up -d

name: tradeforge-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: tradeforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradeforge
      POSTGRES_PASSWORD: ${TF_PG_PASSWORD:?TF_PG_PASSWORD must be set in .env}
      POSTGRES_DB: tradeforge
    # Bind to loopback only: the database shouldn't be exposed to the public internet --
    # 127.0.0.1 is enough for connecting with psql from the host itself.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeforge -d tradeforge"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: tradeforge-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: tradeforge-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093"
      # In production every Kafka client is a container on the same compose network, so
      # there's no need for an extra EXTERNAL listener advertising a host address -- this
      # is the biggest difference from the root docker-compose.yml (in that file, webui/
      # executor run on the host, so they need EXTERNAL to connect in).
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  webui:
    build:
      context: .
      dockerfile: Dockerfile.webui
    container_name: tradeforge-webui
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      TF_PG_HOST: postgres
      TF_PG_PORT: "5432"
      TF_PG_PASSWORD: ${TF_PG_PASSWORD:?}
      TF_REDIS_ADDR: "redis:6379"
      TF_KAFKA_BROKERS: "kafka:9092"
      TF_HTTP_ADDR: ":8080"
      TF_MASTER_KEY: ${TF_MASTER_KEY:?TF_MASTER_KEY must be set in .env (a strong random string, 32+ characters)}
      # Optional: leave unset and the LLM translation layer is unavailable, the
      # wizard/batch-scan pages will show "not ready," everything else (status board,
      # backtest, manual strategy building) is unaffected. Even once it's set, you can
      # still save a separate one / override / switch providers on the /settings page
      # without redeploying the container.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      # Loopback only -- the real public-facing entry point should be a reverse proxy,
      # not this port exposed directly.
      - "127.0.0.1:8080:8080"

  executor:
    build:
      context: .
      dockerfile: go.Dockerfile
      args:
        CMD: executor
    container_name: tradeforge-executor
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      TF_PG_HOST: postgres
      TF_PG_PORT: "5432"
      TF_PG_PASSWORD: ${TF_PG_PASSWORD:?}
      TF_KAFKA_BROKERS: "kafka:9092"
      TF_MASTER_KEY: ${TF_MASTER_KEY:?}
    # Defaults to paper (a pure in-memory simulator) -- won't accidentally hit any real
    # exchange. To actually connect to an exchange, set EXECUTOR_BROKER and
    # EXECUTOR_STATE in .env (e.g. EXECUTOR_BROKER=okx-demo); exchange credentials
    # themselves still go through the /settings page -- don't pass them here as
    # environment variables.
    # -owner-email is required: this process only serves the one registered user
    # specified by TF_OWNER_EMAIL, see item 5 in "Read before deploying" above.
    command: ["-owner-email", "${TF_OWNER_EMAIL:?TF_OWNER_EMAIL must be set in .env}",
              "-broker", "${EXECUTOR_BROKER:-paper}", "-state", "${EXECUTOR_STATE:-PAPER_TRADING}"]

  signal-engine:
    build:
      context: .
      dockerfile: go.Dockerfile
      args:
        CMD: signal-engine
    container_name: tradeforge-signal-engine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      TF_PG_HOST: postgres
      TF_PG_PORT: "5432"
      TF_PG_PASSWORD: ${TF_PG_PASSWORD:?}
      TF_KAFKA_BROKERS: "kafka:9092"
    # -source okx: connects to real market data (local dev defaults to CSV replay, but
    # there's no local CSV file inside the container).
    # -owner-email is required, same user as the executor service -- see item 5 in "Read
    # before deploying" above.
    command: ["-owner-email", "${TF_OWNER_EMAIL:?TF_OWNER_EMAIL must be set in .env}",
              "-source", "okx", "-state", "${EXECUTOR_STATE:-PAPER_TRADING}"]
    # A behavior confirmed normal through real deployment, not a bug in this compose file:
    # signal-engine calls os.Exit(1) outright when zero strategies are in the target state
    # (existing behavior in cmd/signal-engine/main.go -- it's designed as a tool that
    # "runs once a strategy already exists," not one that "idles waiting for a strategy to
    # appear"). Combined with restart: unless-stopped, this means on a brand-new
    # deployment, before the database has any PAPER_TRADING strategy yet, this container
    # will keep restarting in a loop -- this is expected and harmless (Docker's backoff
    # retry doesn't consume meaningful resources). Once a strategy is promoted into that
    # state, the next restart picks it up normally with no manual intervention needed.

volumes:
  pgdata:
  redisdata:
  kafkadata:

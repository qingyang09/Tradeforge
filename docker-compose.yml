name: tradeforge

# Host ports are deliberately offset from the defaults (5432 / 6379 / 9092): this machine
# already has a locally-installed Postgres plus another trading-* container stack
# occupying the default ports. Containers still use the standard ports internally --
# only the host-side mapping is shifted.
services:
  postgres:
    image: postgres:16-alpine
    container_name: tradeforge-postgres
    environment:
      POSTGRES_USER: tradeforge
      POSTGRES_PASSWORD: tradeforge
      POSTGRES_DB: tradeforge
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeforge -d tradeforge"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: tradeforge-redis
    ports:
      - "56379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Single-node Kafka in KRaft mode, no ZooKeeper needed. Local development only.
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: tradeforge-kafka
    ports:
      - "59200:59200"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:59200"
      # EXTERNAL must advertise an address/port the host can actually see, or clients will
      # connect to the wrong place after fetching metadata. 59092 used to collide with
      # Windows's dynamic port exclusion range (netsh interface ipv4 show
      # excludedportrange) -- switched to 59200 to avoid it.
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:59200"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # cp-kafka requires CLUSTER_ID to be a valid base64-encoded UUID -- can't be an
      # arbitrary string.
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

volumes:
  pgdata:
  redisdata:
  kafkadata:

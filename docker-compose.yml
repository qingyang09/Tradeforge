name: tradeforge

# 宿主机端口刻意避开默认值（5432 / 6379 / 9092）：
# 这台机器上已有本机安装的 Postgres 以及另一套 trading-* 容器占用着默认端口。
# 容器内部仍用标准端口，只有宿主机映射做了偏移。
services:
  postgres:
    image: postgres:16-alpine
    container_name: tradeforge-postgres
    environment:
      POSTGRES_USER: tradeforge
      POSTGRES_PASSWORD: tradeforge
      POSTGRES_DB: tradeforge
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeforge -d tradeforge"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: tradeforge-redis
    ports:
      - "56379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Kafka 单节点 KRaft 模式，无需 ZooKeeper。仅用于本地开发。
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: tradeforge-kafka
    ports:
      - "59200:59200"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:59200"
      # EXTERNAL 必须广播成宿主机看得到的地址与端口，否则客户端拿到元数据后会连错。
      # 59092 曾撞上 Windows 动态端口排除区间（netsh interface ipv4 show excludedportrange），
      # 换成 59200 避开。
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:59200"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # cp-kafka 要求 CLUSTER_ID 是合法的 base64 编码 UUID，不能填任意字符串。
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

volumes:
  pgdata:
  redisdata:
  kafkadata:
